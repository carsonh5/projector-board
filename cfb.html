<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CFB Saturday Surf</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet" />
<script src="vendor/confetti.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; color: #fff; overflow: hidden;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif; cursor: none; }
  .zone { position: fixed; overflow: hidden; }

  /* ===== MAIN band ===== */
  #zone-main { top: var(--m-t,30.75vh); bottom: var(--m-b,24.7vh); left: var(--m-l,0); right: var(--m-r,0); z-index: 1; display: flex; flex-direction: column; }
  #head { display: flex; justify-content: space-between; align-items: baseline; padding: 0 3vw; }
  #clock { font-family: "Oswald", sans-serif; font-size: 6vh; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
  #date { font-size: 2.8vh; color: #e6e6e6; text-transform: uppercase; letter-spacing: 0.12em; font-weight: 600; }
  #count { font-family: "Oswald", sans-serif; font-size: 3vh; color: #FFE84D; font-weight: 600; letter-spacing: 0.06em; }

  #bugwrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.4vh; min-height: 0; padding: 0 3vw; }
  #flag .fchip { font-family: "Oswald", sans-serif; font-size: 3.2vh; font-weight: 700; letter-spacing: 0.12em; color: #111;
    padding: 0.4vh 1.6vw; clip-path: polygon(5% 0, 100% 0, 95% 100%, 0 100%); }

  #bug { display: flex; align-items: center; width: 100%; }
  .tmod { flex: 1; display: flex; align-items: center; gap: 1vw; min-width: 0; }
  .tmod.away { justify-content: flex-end; }
  .tmod.home { justify-content: flex-start; }
  .plate { background: #f0f0f0; border-radius: 16%; display: inline-flex; align-items: center; justify-content: center; padding: 0.6vh; flex: 0 0 auto; }
  .plate img { height: 6.5vh; object-fit: contain; display: block; }
  body.white-logos .plate { background: transparent; }
  body.white-logos .plate img { filter: brightness(0) invert(1); }
  .tcell { height: 10vh; display: inline-flex; align-items: center; padding: 0 1.5vw; font-family: "Oswald", sans-serif;
    font-size: 4.8vh; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; white-space: nowrap;
    clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%); }
  .tscore { height: 10vh; min-width: 8vw; display: inline-flex; align-items: center; justify-content: center;
    font-family: "Oswald", sans-serif; font-size: 8.6vh; font-weight: 700; font-variant-numeric: tabular-nums; }
  #center { flex: 0 0 auto; height: 10vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.3vh; padding: 0 1.5vw; }
  #status { font-family: "Oswald", sans-serif; font-size: 4.4vh; font-weight: 600; white-space: nowrap; }
  #dd { font-family: "Barlow Condensed", sans-serif; font-size: 3.4vh; color: #e6e6e6; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; white-space: nowrap; display: flex; align-items: center; }
  .rvl { display: inline-block; width: 3px; height: 3vh; background: #FF2400; margin: 0 0.8vw; border-radius: 1px; }
  #infostrip { font-family: "Barlow Condensed", sans-serif; font-size: 3vh; font-weight: 600; display: flex; align-items: center; gap: 1vw; }
  .chip { background: #f0f0f0; color: #111; font-family: "Oswald", sans-serif; font-weight: 700; font-size: 2.8vh; padding: 0.1vh 0.8vw; border-radius: 4px; }

  /* ===== field-position strip (live spotlight): white line + ball + arrow + first-down tick ===== */
  #field { width: 58%; display: none; align-items: center; }
  #field.on { display: flex; }
  .fp-field { position: relative; width: 100%; height: 4.6vh; }
  .fp-line { position: absolute; left: 0; right: 0; top: 50%; height: 2px; background: #fff; transform: translateY(-50%); }
  .fp-first { position: absolute; top: 8%; bottom: 8%; width: 0.35vw; background: #FFE84D; }
  .fp-tick { position: absolute; top: 34%; bottom: 34%; width: 1px; background: rgba(255,255,255,.4); }
  .fp-ball { position: absolute; top: 50%; left: 0; width: 2.4vw; height: 2.6vh; transform: translate(-50%,-50%); }
  .fp-ball .ball { position: absolute; inset: 0; background: #8a4b1f; border: 0.3vh solid #e8cfa8; border-radius: 50%; }
  .fp-arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 0; height: 0;
    border-top: 1.3vh solid transparent; border-bottom: 1.3vh solid transparent; }
  .fp-arrow.right { left: 145%; border-left: 1.7vh solid #FF6A00; }
  .fp-arrow.left { right: 145%; border-right: 1.7vh solid #FF6A00; }
  /* timeouts: 3 stacked skewed bars, sit between the score and the abbrev pill */
  .tos { display: inline-flex; flex-direction: column; justify-content: center; gap: 0.55vh; padding: 0 0.7vw; }
  .to-bar { width: 1.5vw; height: 0.7vh; background: #fff; transform: skewX(-14deg); }
  .to-bar.off { background: #494e54; }
  /* white possession football, sits just outside the ball-carrier's logo */
  .fbico { height: 5vh; width: auto; display: block; flex: 0 0 auto; }

  /* ===== TICKER band ===== */
  #zone-ticker { top: var(--tk-t,76vh); bottom: var(--tk-b,15vh); left: var(--tk-l,0); right: var(--tk-r,0); z-index: 1; display: flex; align-items: center; }
  #zone-ticker .track { display: inline-block; white-space: nowrap; padding-left: 3vw;
    font-family: "Barlow Condensed", sans-serif; font-size: 4.6vh; font-weight: 700; will-change: transform; }
  @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .item { display: inline-block; padding: 0 1.8vw; }
  .item .sep { color: #6a6f76; padding: 0 0.7vw; }
  .seclbl { color: #FFE84D; font-weight: 700; letter-spacing: 0.08em; }
  .tkplate { padding: 0.3vh; margin: 0 0.3vw; vertical-align: middle; }
  .tkplate img { height: 3.8vh; object-fit: contain; display: block; }
  .tk { border-bottom: 0.3vh solid #888; padding-bottom: 0.1vh; }
  .score { font-variant-numeric: tabular-nums; }

  .lbl { color: #FFE84D; font-weight: 700; }
  .live { color: #FF6A00; } .pre { color: #35E0E0; } .final { color: #d8dce2; }
  .upset { color: #FF2D95; } .close { color: #FF6A00; } .err { color: #FF2D95; }

  .gap { position: fixed; background: #000; z-index: 2; }
  #gapA { top: var(--gA-t,75vh); bottom: var(--gA-b,14vh); left: var(--gA-l,43.85vw); right: var(--gA-r,54.45vw); }
  #gapB { top: var(--gB-t,75vh); bottom: var(--gB-b,14vh); left: var(--gB-l,71.45vw); right: var(--gB-r,24.35vw); }
  #mo-gA { top: var(--gA-t,75vh); bottom: var(--gA-b,14vh); left: var(--gA-l,43.85vw); right: var(--gA-r,54.45vw); }
  #mo-gB { top: var(--gB-t,75vh); bottom: var(--gB-b,14vh); left: var(--gB-l,71.45vw); right: var(--gB-r,24.35vw); }

  #flash { top: var(--m-t,30.75vh); bottom: var(--m-b,24.7vh); left: var(--m-l,0); right: var(--m-r,0); z-index: 5; display: flex; flex-direction: column;
    align-items: center; justify-content: center; background: #000000d9; opacity: 0; transition: opacity .3s; pointer-events: none; }
  #mapmode { display: none; }
  body.mapon #mapmode { display: block; }
  .mo { position: fixed; z-index: 20; border: 1.5px solid #35c759; pointer-events: none; box-sizing: border-box; }
  .mo.sel { border-width: 3px; }
  #mo-m { border-color: #a78bfa; }            /* main = purple */
  #mo-gA, #mo-gB { border-color: #3b9bff; }   /* gaps = blue (ticker stays green) */
  #mo-m { top: var(--m-t,30.75vh); bottom: var(--m-b,24.7vh); left: var(--m-l,0); right: var(--m-r,0); }
  #mo-tk { top: var(--tk-t,76vh); bottom: var(--tk-b,15vh); left: var(--tk-l,0); right: var(--tk-r,0); }
  #mo-info { position: fixed; z-index: 21; left: 50%; top: 48vh; transform: translate(-50%,-50%); background: #000000e6; color: #fff;
    font-family: "Oswald", sans-serif; font-size: 2.8vh; text-align: center; padding: 2vh 3vw; border: 2px solid #35c759; border-radius: 10px; line-height: 1.6; }
  #mo-info b { color: #FFE84D; }
  #flash.on { opacity: 1; }
  #flash .big { font-family: "Oswald", sans-serif; font-size: 11vh; font-weight: 700; line-height: 1; }
  #flash .sub { font-family: "Oswald", sans-serif; font-size: 5vh; font-weight: 600; margin-top: 1vh; }
  #flash .big .tdl { display: inline-block; transform: translateY(-140%) scale(.7); opacity: 0;
    animation: tdrop .5s cubic-bezier(.34,1.56,.64,1) forwards; will-change: transform, opacity; }
  @keyframes tdrop { 0%{transform:translateY(-140%) scale(.7);opacity:0} 60%{transform:translateY(6%) scale(1.05);opacity:1}
    80%{transform:translateY(-2%) scale(.98);opacity:1} 100%{transform:translateY(0) scale(1);opacity:1} }
</style>
</head>
<body>
  <div class="zone" id="zone-main">
    <div id="head"><div><div id="clock">--:--</div><div id="date"></div></div><div id="count">loading&hellip;</div></div>
    <div id="bugwrap">
      <div id="flag"></div>
      <div id="bug"><div class="tscore" style="font-size:5vh">Loading&hellip;</div></div>
      <div id="infostrip"></div>
      <div id="field"></div>
    </div>
  </div>
  <div class="zone" id="zone-ticker"><div class="track" id="t-ticker"><span class="item">Loading&hellip;</span></div></div>
  <div class="gap" id="gapA"></div><div class="gap" id="gapB"></div>
  <div class="zone" id="flash"><div class="big" id="flash-big"></div><div class="sub" id="flash-sub"></div></div>
  <div id="mapmode"><div class="mo" id="mo-m"></div><div class="mo" id="mo-tk"></div><div class="mo" id="mo-gA"></div><div class="mo" id="mo-gB"></div><div id="mo-info"></div></div>

<script>
"use strict";
function _fbDate(){ const d=new Date(); if(d.getHours()<6) d.setDate(d.getDate()-1);
  return ""+d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0"); }
function sbUrl(){ return "https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?dates="+_fbDate()+"&limit=100"; }

function tick(){ const n=new Date(); let h=n.getHours(); const m=String(n.getMinutes()).padStart(2,"0");
  const ap=h>=12?"PM":"AM"; h=h%12||12; document.getElementById("clock").textContent=`${h}:${m} ${ap}`;
  document.getElementById("date").textContent=n.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"}); }
setInterval(tick,1000); tick();

document.addEventListener("keydown", e=>{
  if(e.key==="l"||e.key==="L") document.body.classList.toggle("white-logos");
  if(e.key==="t"||e.key==="T") celebrate("BUFFS","#FF6A00",7);
  if(e.key==="a"||e.key==="A"){ showAll=!showAll; render(); }
  if(e.key==="g"||e.key==="G"){ demoIx++; if(demoIx>DEMOS.length){ demoIx=0; DEMO=null; } else DEMO=DEMOS[demoIx-1]; render(); }
});
document.addEventListener("click", ()=>{ const el=document.documentElement; if(el.requestFullscreen) el.requestFullscreen().catch(()=>{}); });

function teamColors(hex){ let n=parseInt(hex||"888888",16); if(isNaN(n)) n=0x888888;
  let r=(n>>16)&255,g=(n>>8)&255,b=n&255; const L0=0.299*r+0.587*g+0.114*b;
  if(L0<95){ const f=95/Math.max(L0,1); r=Math.min(255,r*f); g=Math.min(255,g*f); b=Math.min(255,b*f); }
  const L=0.299*r+0.587*g+0.114*b; return { bg:`rgb(${r|0},${g|0},${b|0})`, text: L>150?"#111":"#fff" }; }
const rankNum = t => { const r=t?.curatedRank?.current; return (r&&r<=25)?r:99; };
const rk = t => { const r=rankNum(t); return r<99?`#${r} `:""; };
const logoOf = t => t.logo || t.logos?.[0]?.href || `https://a.espncdn.com/i/teamlogos/ncaa/500/${t.id}.png`;
function channelOf(c){ const b=c.broadcasts?.[0]; if(b?.names?.length) return b.names.join("/");
  const g=c.geoBroadcasts?.[0]; return g?.media?.shortName||""; }
function oddsOf(c){ const o=c.odds?.[0]; if(!o) return {line:"",ou:""};
  return { line:o.details||"", ou:(o.overUnder!=null)?`O/U ${o.overUnder}`:"" }; }
function favSide(c){ const o=c.odds?.[0]; if(!o) return null;
  if(o.homeTeamOdds?.favorite) return "home"; if(o.awayTeamOdds?.favorite) return "away"; return null; }

let games=[], lastScores={}, firstLoad=true;
async function load(){
  try{
    const res=await fetch(sbUrl()); if(!res.ok) throw new Error("HTTP "+res.status);
    const data=await res.json();
    games=(data.events||[]).map(ev=>{
      const c=ev.competitions[0];
      const home=c.competitors.find(t=>t.homeAway==="home"), away=c.competitors.find(t=>t.homeAway==="away");
      const st=ev.status.type, state=st.state, hS=+home.score||0, aS=+away.score||0, fav=favSide(c);
      const aR=rankNum(away.team), hR=rankNum(home.team);
      const isUpset=state==="in"&&fav&&((fav==="home"?aS:hS)>(fav==="home"?hS:aS));
      const period=c.status?.period||0, isClose=state==="in"&&period>=4&&Math.abs(hS-aS)<=8;
      let watch=-1;
      if(state==="in"){ watch=100-Math.abs(hS-aS)*5; if(period>=4)watch+=20; else if(period>=3)watch+=10;
        if(isUpset)watch+=30; if(c.situation?.isRedZone)watch+=15; }
      const {line,ou}=oddsOf(c);
      return { id:ev.id, date:ev.date, aAbbr:away.team.abbreviation, hAbbr:home.team.abbreviation,
        aLoc:away.team.location||"", hLoc:home.team.location||"",
        aName:rk(away.team)+away.team.abbreviation, hName:rk(home.team)+home.team.abbreviation,
        aLogo:logoOf(away.team), hLogo:logoOf(home.team), aTC:teamColors(away.team.color), hTC:teamColors(home.team.color),
        aColUnder:teamColors(away.team.color).bg, hColUnder:teamColors(home.team.color).bg,
        aS,hS,state, detail:st.shortDetail||"", channel:channelOf(c), line, ou,
        ranked:(aR<99||hR<99), topRank:Math.min(aR,hR),
        redzone:!!c.situation?.isRedZone, possText:c.situation?.possessionText||"", dd:c.situation?.shortDownDistanceText||"",
        poss:c.situation?.possession||"", aId:away.team.id, hId:home.team.id, dist:(c.situation&&c.situation.distance!=null?+c.situation.distance:null),
        aTO:(c.situation&&c.situation.awayTimeouts!=null?+c.situation.awayTimeouts:null), hTO:(c.situation&&c.situation.homeTimeouts!=null?+c.situation.homeTimeouts:null),
        isUpset, isClose, watch, start: (function(d){return d.toLocaleDateString("en-US",{weekday:"short"}).toUpperCase()+" "+d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});})(new Date(ev.date)) };
    });
    games.forEach(g=>{ const p=lastScores[g.id];
      if(p&&!firstLoad){ if(g.aS>p.a) celebrate(g.aAbbr,g.aTC.bg,g.aS-p.a); if(g.hS>p.h) celebrate(g.hAbbr,g.hTC.bg,g.hS-p.h); }
      lastScores[g.id]={a:g.aS,h:g.hS}; });
    firstLoad=false; render();
  }catch(e){
    document.getElementById("bug").innerHTML=`<span class="err" style="font-family:Oswald;font-size:4vh">scores failed: ${e.message}</span>`;
    document.getElementById("t-ticker").innerHTML=`<span class="item err">CFB feed failed: ${e.message} — likely needs the backend</span>`;
  }
}

let flashTimer;
function celebrate(team,col,delta){
  const label=delta>=6?"TOUCHDOWN":(delta===3?"FIELD GOAL":"SCORE");
  document.getElementById("flash-big").innerHTML = label.split("").map(function(ch,i){
    return `<span class="tdl" style="color:${col};animation-delay:${(0.045*i).toFixed(3)}s">${ch===" "?"&nbsp;":ch}</span>`; }).join("");
  document.getElementById("flash-sub").textContent=team;
  const f=document.getElementById("flash"); f.classList.remove("on"); void f.offsetWidth; f.classList.add("on");
  clearTimeout(flashTimer); flashTimer=setTimeout(function(){ f.classList.remove("on"); }, delta>=6?5200:3500);
  if(window.confetti){ confetti({colors:[col,"#ffffff"], particleCount:delta>=6?200:70, spread:110, startVelocity:50, origin:{y:0.55}, ticks:230}); }
}

function plate(logo){ return `<span class="plate"><img src="${logo}" onerror="this.closest('.plate').style.display='none'"></span>`; }
function tmod(logo,name,score,tc,home,to,ball){
  const cell=`<span class="tcell" style="background:${tc.bg};color:${tc.text}">${name}</span>`;
  const sc=score!==""?`<span class="tscore">${score}</span>`:"";
  const tos=tosBars(to);
  const fb=ball?FBALL:"";
  return `<div class="tmod ${home?'home':'away'}">${home ? sc+tos+cell+plate(logo)+fb : fb+plate(logo)+cell+tos+sc}</div>`;
}
const FLAGS={live:["LIVE","#FF1A1A"],upset:["UPSET ALERT","#FF2D95"],close:["CLOSE GAME","#FF6A00"],rz:["RED ZONE","#FF6A00"],pre:["NEXT UP","#35E0E0"]};
let FEATURE=["baylor","oregon"], showAll=true;   // regular full CFB by default; press A for featured
function inFeature(g){ if(showAll||!FEATURE.length) return true;
  const keys=[g.aAbbr,g.hAbbr,g.aLoc,g.hLoc].map(s=>(s||"").toLowerCase()); return FEATURE.some(f=>keys.includes(f)); }
function centerHTML(g){
  if(g.state==="in") return `<div id="status" class="live">${g.detail}</div>`
    + `${(g.dd||g.possText)?`<div id="dd">${g.dd||""}${g.dd&&g.possText?'<span class="rvl"></span>':""}${g.possText||""}</div>`:""}`;
  if(g.state==="pre") return `<div id="status" class="pre">${g.start}</div>`;
  return `<div id="status" class="final">FINAL</div>`;
}
/* ===== field-position marker: parse ESPN possession into a 0-100 field spot ===== */
/* orientation: AWAY end zone = left (x=0), HOME end zone = right (x=100) */
function fieldPos(g){
  if(g.state!=="in") return null;
  const pt=(g.possText||"").trim(); if(!pt||!g.poss) return null;
  const m=pt.match(/^(.*?)(\d{1,2})\s*$/); if(!m) return null;
  const side=(m[1]||"").trim().toUpperCase(), yard=+m[2];
  const possIsHome=String(g.poss)===String(g.hId), possIsAway=String(g.poss)===String(g.aId);
  if(!possIsHome&&!possIsAway) return null;
  const possAbbr=(possIsHome?g.hAbbr:g.aAbbr).toUpperCase();
  let ytg;                                   // yards to the defense's end zone
  if(!side) ytg=50; else if(side===possAbbr) ytg=100-yard; else ytg=yard;
  ytg=Math.max(0,Math.min(100,ytg));
  let ballX,dir,firstX=null;
  if(possIsAway){ dir="right"; ballX=100-ytg; if(g.dist!=null) firstX=Math.min(100,ballX+g.dist); }
  else          { dir="left";  ballX=ytg;     if(g.dist!=null) firstX=Math.max(0,  ballX-g.dist); }
  return { ballX, dir, firstX, redzone:!!g.redzone, possIsHome };
}
function fieldHTML(fp){
  let ticks=""; for(let x=10;x<100;x+=10) ticks+=`<div class="fp-tick" style="left:${x}%"></div>`;   // 10-yard ticks
  const first=(fp.firstX!=null)?`<div class="fp-first" style="left:${fp.firstX}%"></div>`:"";
  const arrow=`<span class="fp-arrow ${fp.dir}"></span>`;
  const ball=`<div class="fp-ball" style="left:${fp.ballX}%"><span class="ball"></span>${arrow}</div>`;
  return `<div class="fp-field"><div class="fp-line"></div>${ticks}${first}${ball}</div>`;
}
function setField(g){ const el=document.getElementById("field"); const fp=g?fieldPos(g):null;
  if(fp){ el.className="on"; el.innerHTML=fieldHTML(fp); } else { el.className=""; el.innerHTML=""; } }
/* white possession football (SVG silhouette) + which side has the ball */
const FBALL='<svg class="fbico" viewBox="0 0 60 40"><path d="M6 20 C18 4 42 4 54 20 C42 36 18 36 6 20 Z" fill="#fff" stroke="#111" stroke-width="2.2"/></svg>';
function possSide(g){ if(g.state!=="in"||!g.poss) return null;
  if(String(g.poss)===String(g.hId)) return "home";
  if(String(g.poss)===String(g.aId)) return "away"; return null; }
function tosBars(to){ if(to==null) return "";
  let b=""; for(let i=0;i<3;i++) b+=`<span class="to-bar${ i<(3-to) ? ' off':'' }"></span>`;   // empty from the top down
  return `<span class="tos">${b}</span>`; }

/* ===== demo mode (press G to cycle field scenarios; no live game needed) ===== */
function dTeam(id,abbr,color){ return {id,abbr,color}; }
function makeDemo(a,h,possText,possIsHome,dist,rz,detail,dd,aS,hS,aTO,hTO){
  const aTC=teamColors(a.color), hTC=teamColors(h.color), L=id=>`https://a.espncdn.com/i/teamlogos/ncaa/500/${id}.png`;
  return { id:"demo", state:"in", detail, aAbbr:a.abbr, hAbbr:h.abbr, aName:a.abbr, hName:h.abbr,
    aLogo:L(a.id), hLogo:L(h.id), aTC, hTC, aColUnder:aTC.bg, hColUnder:hTC.bg, aS, hS,
    channel:"DEMO", line:"", ou:"", dd, possText, poss:(possIsHome?h.id:a.id), aId:a.id, hId:h.id,
    dist, redzone:rz, aTO, hTO, isUpset:false, isClose:false };
}

/* ticker item + section builder */
// logos back in (paged ticker is static -> images are cheap); no color underline
const T=(logo,abbr,col)=>`<span class="plate tkplate"><img src="${logo}" onerror="this.closest('.plate').style.display='none'"></span>${abbr}`;
function tickItem(g){
  const a=T(g.aLogo,g.aAbbr,g.aColUnder), h=T(g.hLogo,g.hAbbr,g.hColUnder);
  const chan=g.channel?` <span class="sep">·</span> <span class="lbl">${g.channel}</span>`:"";
  const ln=g.line?` <span class="sep">·</span> ${g.line}`:"";
  if(g.state==="in"){ const f=g.isUpset?'<span class="upset">UPSET </span>':(g.isClose?'<span class="close">CLOSE </span>':'');
    return `<span class="item"><span class="score">${a} ${g.aS} – ${h} ${g.hS}</span> <span class="sep">·</span> ${f}<span class="live">${g.detail}</span>${chan}${ln}</span>`; }
  if(g.state==="pre"){ return `<span class="item"><span class="pre">${a} @ ${h}</span> <span class="sep">·</span> ${g.start}${chan}${ln}</span>`; }
  return `<span class="item"><span class="score">${a} ${g.aS} – ${h} ${g.hS}</span> <span class="sep">·</span> <span class="final">${g.detail}</span></span>`;
}
const seclbl = t => `<span class="item"><span class="seclbl">${t}</span></span>`;

let spotIx=0;
function renderTicker(){
  /* wider slate: ALL live + ranked upcoming + ranked results (NOT limited to the featured game) */
  const liveT = games.filter(g=>g.state==="in").sort((a,b)=>b.watch-a.watch).slice(0,12);
  const upT   = games.filter(g=>g.state==="pre" && g.ranked).sort((a,b)=> a.date<b.date?-1:1).slice(0,10);
  const resT  = games.filter(g=>g.state==="post" && g.ranked).sort((a,b)=>a.topRank-b.topRank).slice(0,12);
  let parts=[];
  liveT.forEach(g=>parts.push(tickItem(g)));
  upT.forEach(g=>parts.push(tickItem(g)));
  resT.forEach(g=>parts.push(tickItem(g)));
  if(!parts.length) games.slice(0,14).forEach(g=>parts.push(tickItem(g)));   // fallback so the ticker is never near-empty
  setTicker(parts);
}

}
