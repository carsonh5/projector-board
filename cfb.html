<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>CFB Saturday Surf</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet" />
<script src="vendor/confetti.min.js"></script>
<script src="highlights.js"></script>
<script src="playerstats.js"></script>
<script src="standings.js"></script>
<script src="schedule.js"></script>
<script src="td-celebration.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; color: #fff; overflow: hidden;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif; cursor: none; }
  .zone { position: fixed; overflow: hidden; }

  /* ===== MAIN band ===== */
  #zone-main { top: var(--m-t,30.75vh); bottom: var(--m-b,24.7vh); left: var(--m-l,0); right: var(--m-r,0); z-index: 1; display: flex; flex-direction: column; }
  #head { display: flex; justify-content: space-between; align-items: baseline; padding: 0 3vw; }
  #clock { font-family: "Oswald", sans-serif; font-size: 4.8vh; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
  #date { font-size: 2.4vh; color: #e6e6e6; text-transform: uppercase; letter-spacing: 0.12em; font-weight: 600; }
  #count { font-family: "Oswald", sans-serif; font-size: 2.6vh; color: #FFE84D; font-weight: 600; letter-spacing: 0.06em; }
  .hd-right { display: flex; flex-direction: column; align-items: flex-end; gap: 0.5vh; }
  #delaybadge { font-family: "Oswald", sans-serif; font-size: 3.4vh; font-weight: 700; color: #fff; background: #D50000; padding: 0.15vh 0.9vw; border-radius: 5px; letter-spacing: 0.02em; font-variant-numeric: tabular-nums; }
  #delaybadge:empty { display: none; }

  /* robust vertical structure: top region (1fr) holds the centered bug; play-by-play is a fixed floor at the bottom that never overflows */
  #bugwrap { flex: 1; position: relative; display: grid; grid-template-rows: 1fr auto; min-height: 0; padding: 0 3vw 2.4vh; }
  #bugmain { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.35vh; min-height: 0; overflow: hidden; }
  #venue { flex: 0 0 auto; margin: 0.5vh 0 0.6vh; padding: 0 3vw; font-family: "Barlow Condensed", sans-serif; font-size: 2.6vh; color: #b0b4bb; text-transform: uppercase; letter-spacing: 0.08em; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #venue:empty { display: none; }
  body.cards #venue, body.stacked #venue, body.hl #venue, body.ps #venue, body.standings #venue, body.schedule #venue { display: none; }
  #lastplay { justify-self: center; margin: 0.5vh 0 0.2vh; font-family: "Barlow Condensed", sans-serif; font-size: 3.6vh; font-weight: 600; color: #c4c8ce; text-align: center; max-width: 90%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #lastplay:empty { display: none; }
  body.cards #lastplay, body.stacked #lastplay, body.hl #lastplay, body.ps #lastplay { display: none; }
  /* highlights fill Zone 1 (final/halftime of a featured game) — 3-column grid */
  #hl { display: none; position: absolute; inset: 0; z-index: 1; box-sizing: border-box; }
  body.hl #hl {
    display: grid;
    grid-template-columns: 16fr 44fr 40fr;   /* fr units subtract the gaps automatically — never overflow */
    grid-template-rows: 100%;
    align-items: stretch;
    gap: 0.8vw;
    padding: 0.8vh 1vw;
    height: 100%;
    box-sizing: border-box;
  }
  body.hl #flag, body.hl #bug, body.hl #infostrip, body.hl #field, body.hl #stack, body.hl #cards { display: none; }
  /* final recap is self-evidently a finished game: hide clock/date, FEATURED label, delay pill, venue */
  body.hl #head, body.hl #venue { display: none; }

  /* ── left column: team identity + score ── */
  #hlscore {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 0.6vh;
    min-height: 0;
    overflow: hidden;
    padding: 0.6vh 0.4vw;
  }
  .hlscoreboard { display: flex; flex-direction: column; gap: 0.5vh; }
  .hlfinal {
    font-family: "Oswald", sans-serif; font-weight: 700; font-size: 2.6vh;
    color: #FFE84D; letter-spacing: 0.2em; text-transform: uppercase;
    margin-bottom: 0.4vh; text-align: center;
  }
  /* each team block stacked vertically: abbrev → logo → score */
  .hlteamrow {
    display: flex; flex-direction: column; align-items: stretch;
    gap: 0.5vh; padding: 0.5vh 0.4vw 0.6vh; border-radius: 0.5vh;
  }
  .hlteamrow.winner { background: rgba(255,255,255,0.06); }
  /* logo + score on one line, using the column's horizontal space */
  .hllsrow { display: flex; align-items: center; justify-content: space-between; gap: 0.6vw; padding: 0 0.4vw; }
  /* abbreviation above logo */
  .hlteampill {
    font-family: "Oswald", sans-serif; font-weight: 700; font-size: 3.6vh;
    letter-spacing: 0.02em; text-transform: uppercase;
    padding: 0.15vh 0.5vw; border-radius: 0.35vh;
    width: 100%; text-align: center; box-sizing: border-box;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .hlteamlogo {
    width: 6.5vh; height: 6.5vh; object-fit: contain;
    flex-shrink: 0;
  }
  /* large final score beside the logo */
  .hlteamscore {
    font-family: "Oswald", sans-serif; font-weight: 700; font-size: 6vh;
    color: #fff; line-height: 1; text-align: right; font-variant-numeric: tabular-nums;
  }
  .hlteamscore.loser { color: #5a6270; font-weight: 400; }
  /* divider between teams */
  .hlteamdiv { height: 1px; background: rgba(255,255,255,0.1); margin: 0.2vh 0.4vw; }

  /* ── middle column: video + caption ── */
  #hlmid {
    display: flex; flex-direction: column; gap: 0.5vh;
    min-height: 0; overflow: hidden;
  }
  #hlvid {
    flex: 1 1 0; min-height: 0; background: #000;
    border-radius: 0.5vh; overflow: hidden;
    /* keep 16:9 via object-fit on inner video/iframe — container just fills available space */
  }
  /* caption sits below the video, small secondary label */
  #hlcap {
    flex: 0 0 auto;
    font-family: "Barlow Condensed", sans-serif; font-weight: 500;
    font-size: 1.6vh; color: #6a7280; line-height: 1.2;
    padding: 0 0.2vw; overflow: hidden;
    white-space: nowrap; text-overflow: ellipsis;
  }

  /* ── right column: stat leaders — teams STACKED, full-width rows, readable minimums ── */
  #hlstats {
    display: flex; flex-direction: column; justify-content: center; gap: 1.2vh;
    min-height: 0; overflow: hidden;
    padding: 0.4vh 0.4vw;
  }
  .hlstatsgrid {
    display: flex; flex-direction: column; gap: 1.4vh; flex: 1; min-height: 0; overflow: hidden; justify-content: center;
  }
  .hlstatcol {
    display: flex; flex-direction: column; gap: 0.25vh; min-width: 0;
  }
  .hlstathdr {
    display: flex; align-items: center; gap: 0.5vw;
    padding: 0 0 0.35vh;
    border-bottom: 1px solid rgba(255,255,255,0.18);
    margin-bottom: 0.3vh; flex-shrink: 0;
  }
  .hlstathdr-logo {
    width: 4.4vh; height: 4.4vh; object-fit: contain;
    flex-shrink: 0;
  }
  .hlstathdr-abbr {
    font-family: "Oswald", sans-serif; font-weight: 700; font-size: 3.8vh;
    color: #fff; letter-spacing: 0.03em; text-transform: uppercase;
  }
  /* one leader on a single horizontal line: LABEL · player name · value */
  .hlstatrow {
    display: flex; align-items: baseline; gap: 0.6vw;
    padding: 0.2vh 0;
    flex-shrink: 0;
  }
  .hlstatk {
    font-family: "Oswald", sans-serif; font-weight: 700; font-size: 3.6vh;
    color: #FFE84D; letter-spacing: 0.03em; text-transform: uppercase;
    line-height: 1; flex: 0 0 6vw;
  }
  .hlstatval {
    font-family: "Oswald", sans-serif; font-weight: 700; font-size: 3.6vh;
    color: #fff; line-height: 1; flex: 0 0 auto; white-space: nowrap; margin-left: auto;
  }
  .hlstatplayer {
    font-family: "Barlow Condensed", sans-serif; font-weight: 600;
    font-size: 3.6vh; color: #c4c8ce; line-height: 1.1; flex: 1 1 auto; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* legacy classes – kept for safety, unused in new layout */
  .hlteamname { display: none; }
  .hlteam { display: none; }
  .hlstat { display: none; }
  .hlstat .k { display: none; }
  /* old side-panel – no longer in DOM, guard against any residual reference */
  #hlside { display: none; }
  #ps { display: none; position: absolute; inset: 0; z-index: 1; }
  body.ps #ps { display: block; }
  body.ps #flag, body.ps #bug, body.ps #infostrip, body.ps #field, body.ps #stack, body.ps #cards, body.ps #hl { display: none; }
  #standings, #schedule { display: none; position: absolute; inset: 0; z-index: 1; }
  body.standings #standings, body.schedule #schedule { display: block; }
  body.standings #flag, body.standings #bug, body.standings #infostrip, body.standings #field, body.standings #stack, body.standings #cards, body.standings #hl, body.standings #ps { display: none; }
  body.schedule #flag, body.schedule #bug, body.schedule #infostrip, body.schedule #field, body.schedule #stack, body.schedule #cards, body.schedule #hl, body.schedule #ps { display: none; }
  #flag { line-height: 1; }
  #flag .fchip { display: inline-block; font-family: "Oswald", sans-serif; font-size: 2.8vh; font-weight: 700; letter-spacing: 0.12em; color: #111;
    line-height: 1.25; padding: 0.7vh 1.6vw 0.6vh; clip-path: polygon(5% 0, 100% 0, 95% 100%, 0 100%); }

  #bug { display: flex; align-items: center; width: 100%; }
  .tmod { flex: 1; display: flex; align-items: center; gap: 1vw; min-width: 0; }
  .tmod.away { justify-content: flex-end; }
  .tmod.home { justify-content: flex-start; }
  .plate { background: #f0f0f0; border-radius: 16%; display: inline-flex; align-items: center; justify-content: center; padding: 0.6vh; flex: 0 0 auto; }
  .plate img { height: 6.5vh; object-fit: contain; display: block; }
  body.white-logos .plate { background: transparent; }
  body.white-logos .plate img { filter: brightness(0) invert(1); }
  .tcell { height: 7.4vh; display: inline-flex; align-items: center; padding: 0 1.5vw; font-family: "Oswald", sans-serif;
    font-size: 4.2vh; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; white-space: nowrap;
    clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%); }
  .tscore { height: 7.4vh; min-width: 8vw; display: inline-flex; align-items: center; justify-content: center;
    font-family: "Oswald", sans-serif; font-size: 7vh; font-weight: 700; font-variant-numeric: tabular-nums; }
  #center { flex: 0 0 auto; height: 7.4vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.3vh; padding: 0 1.5vw; }
  #status { font-family: "Oswald", sans-serif; font-size: 3.6vh; font-weight: 600; white-space: nowrap; }
  #dd { font-family: "Barlow Condensed", sans-serif; font-size: 2.7vh; color: #e6e6e6; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; white-space: nowrap; display: flex; align-items: center; }
  .rvl { display: inline-block; width: 3px; height: 2.6vh; background: #FF2400; margin: 0 0.8vw; border-radius: 1px; }
  #infostrip { margin-top: 0.9vh; font-family: "Barlow Condensed", sans-serif; font-size: 2.5vh; font-weight: 600; display: flex; align-items: center; gap: 1vw; }
  #infostrip:empty { display: none; }
  .chip { background: #f0f0f0; color: #111; font-family: "Oswald", sans-serif; font-weight: 700; font-size: 2.8vh; padding: 0.1vh 0.8vw; border-radius: 4px; }

  /* ===== field-position strip (live spotlight): white line + ball + arrow + first-down tick ===== */
  #field { width: 58%; display: none; align-items: center; }
  #field.on { display: flex; }
  .fp-field { position: relative; width: 100%; height: 4vh; }
  .fp-line { position: absolute; left: 0; right: 0; top: 50%; height: 2px; background: #fff; transform: translateY(-50%); }
  .fp-first { position: absolute; top: 8%; bottom: 8%; width: 0.35vw; background: #FFE84D; }
  .fp-tick { position: absolute; top: 30%; bottom: 30%; width: 2.5px; background: rgba(255,255,255,.6); transform: translateX(-50%); }
  .fp-ball { position: absolute; top: 50%; left: 0; width: 2.4vw; height: 2.6vh; transform: translate(-50%,-50%); }
  .fp-ball .ball { position: absolute; inset: 0; background: #8a4b1f; border: 0.3vh solid #e8cfa8; border-radius: 50%; }
  .fp-arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 0; height: 0;
    border-top: 1.3vh solid transparent; border-bottom: 1.3vh solid transparent; }
  .fp-arrow.right { left: 145%; border-left: 1.7vh solid #FF6A00; }
  .fp-arrow.left { right: 145%; border-right: 1.7vh solid #FF6A00; }
  /* timeouts: 3 stacked skewed bars, sit between the score and the abbrev pill */
  .tos { display: inline-flex; flex-direction: column; justify-content: center; gap: 0.55vh; padding: 0 0.7vw; }
  .to-bar { width: 1.5vw; height: 0.7vh; background: #fff; transform: skewX(-14deg); }
  .to-bar.off { background: #494e54; }
  /* white possession football, sits just outside the ball-carrier's logo */
  .fbico { height: 4vh; width: auto; display: block; flex: 0 0 auto; }
  /* multi-feature: vertical stacked mini score bugs */
  #stack { display: none; flex-direction: column; width: 100%; gap: 1.8vh; padding: 0 2vw; }
  body.stacked #stack { display: flex; }
  body.stacked #flag, body.stacked #bug, body.stacked #infostrip, body.stacked #field { display: none; }
  .srow { display: flex; align-items: center; width: 100%; gap: 1vw; }
  .steam { display: flex; align-items: center; gap: 0.8vw; flex: 1; min-width: 0; }
  .steam.away { justify-content: flex-end; }
  .steam.home { justify-content: flex-start; }
  .splate { background: #f0f0f0; border-radius: 14%; padding: 0.4vh; display: inline-flex; flex: 0 0 auto; }
  .splate img { height: 5vh; object-fit: contain; display: block; }
  body.white-logos .splate { background: transparent; }
  body.white-logos .splate img { filter: brightness(0) invert(1); }
  .sabbr { font-family: "Oswald", sans-serif; font-weight: 700; font-size: 4vh; text-transform: uppercase; }
  .ssc { font-family: "Oswald", sans-serif; font-weight: 700; font-size: 5.4vh; font-variant-numeric: tabular-nums; min-width: 2.2ch; text-align: center; }
  .ssep { color: #6a6f76; font-size: 3.2vh; padding: 0 0.3vw; }
  .sstat { flex: 0 0 auto; width: 16vw; text-align: right; font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 3vh; display: flex; align-items: center; justify-content: flex-end; gap: 0.6vw; text-transform: uppercase; }
  .sstat.live { color: #FF6A00; } .sstat.pre { color: #35E0E0; } .sstat.final { color: #d8dce2; }
  .stag { font-family: "Oswald", sans-serif; font-size: 2.2vh; font-weight: 700; color: #fff; background: #FF1A1A; padding: 0.1vh 0.6vw; border-radius: 3px; }
  .stag.up { background: #FF2D95; }
  /* pre-game countdown (single feature) */
  .cd { font-family: "Oswald", sans-serif; font-size: 3.6vh; font-weight: 700; color: #35E0E0; font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }
  /* ===== game cards (feature view): opponent-top / opponent-bottom in one box, side by side ===== */
  #cards { display: none; width: 100%; height: 100%; align-items: center; justify-content: center; gap: 2vw; padding: 0 2vw; }
  body.cards #cards { display: flex; }
  body.cards #flag, body.cards #bug, body.cards #infostrip, body.cards #field, body.cards #stack { display: none; }

  /* Card shell — FIXED identical size for every card; both cards always same footprint */
  .gcard {
    flex: 0 0 26vw;          /* fixed width — no flex shrink/grow */
    width: 26vw;
    height: 24vh;            /* compact broadcast footprint — fits the zone, footer always visible, minimal dead space */
    display: grid;
    grid-template-rows: 1fr 1fr auto;   /* band-away | band-home | footer */
    border: 0.3vh solid #05070a;
    border-radius: 1vh;
    overflow: hidden;
    box-shadow: 0 0 0 1px #2a2f37, 0 1vh 3vh #0009;
    background: #0c0e12;
  }
  body.cards.n1 .gcard { flex: 0 0 38vw; width: 38vw; }

  /* Each team band: CSS grid — [gmain: rank+abbrev+poss+tos] | [score] | [logo] */
  .gteam {
    display: grid;
    grid-template-columns: 1fr auto auto;  /* text grows, score fixed, logo fixed */
    align-items: center;
    padding: 0.9vh 1.2vw 0.9vh 1.4vw;
    gap: 0 1vw;
    overflow: hidden;
  }
  /* gmain: holds rank+abbrev+football+timeouts stacked; no clipping of abbreviations */
  .gteam .gmain {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 0.35vh;
    min-width: 0;
    overflow: visible;
  }
  /* logo: sits directly on the team-color band — NO white pill */
  .gteam .glogo {
    flex: 0 0 auto;
    width: 7vh;
    height: 7vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* white outline via drop-shadow so logos read on any team color */
  .gteam .glogo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    filter:
      drop-shadow(0.8px 0 0 #fff)
      drop-shadow(-0.8px 0 0 #fff)
      drop-shadow(0 0.8px 0 #fff)
      drop-shadow(0 -0.8px 0 #fff);
  }

  /* rank chip + abbreviation row — rank same size as name, inline before it */
  .gtop { display: flex; align-items: baseline; gap: 0.4vw; overflow: visible; flex-wrap: nowrap; }
  /* rank: same font-size as .gname so "#24 LOU" reads as one unit */
  .grank {
    font-family: "Oswald", sans-serif;
    font-weight: 700;
    font-size: 4.3vh;    /* matches .gname, same color (no dim) */
    opacity: 1;
    flex: 0 0 auto;
    line-height: 1;
  }
  .gname {
    font-family: "Oswald", sans-serif;
    font-weight: 700;
    font-style: italic;
    font-size: 4.3vh;
    text-transform: uppercase;
    letter-spacing: 0.01em;
    white-space: nowrap;
    overflow: visible;
    text-overflow: clip;
    line-height: 1;
  }
  /* possession football: inline to the right of the team name */
  .gposs-inline {
    display: inline-flex;
    align-items: center;
    margin-left: 0.5vw;
    vertical-align: middle;
  }
  .gposs-inline .fbico { height: 2.4vh; width: auto; }

  /* timeout bars on the team band — row beneath the name */
  .gband-tos { display: flex; align-items: center; }
  .gband-tos .tos { padding: 0; gap: 0.4vw; flex-direction: row; }
  .gband-tos .to-bar { width: 1.4vw; height: 0.42vh; transform: none; border-radius: 1px; }   /* 3 short horizontal ticks, side by side, under the name */

  /* score column: fixed-width tabular cell */
  .gscorerow {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 4.5ch;
  }
  .gscore {
    font-family: "Oswald", sans-serif;
    font-weight: 700;
    font-size: 6.2vh;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  /* ---- Footer ---- */
  .gfoot {
    background: #0a0c10;
    display: flex;
    flex-direction: column;
    flex: 0 0 auto;
    padding: 0.55vh 0.8vw 0.6vh;
    gap: 0.2vh;
  }

  /* Single-line status row: clock · quarter   DD · yard-line */
  .gstat {
    font-family: "Oswald", sans-serif;
    font-weight: 700;
    font-size: 2.6vh;
    color: #fff;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    text-align: center;
    line-height: 1.15;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .gstat.pre { color: #35E0E0; }
  .gstat.fin { color: #d8dce2; }

  /* down & distance — shares the same line as clock via .gstat-row; kept as distinct span inside */
  .gdd {
    font-family: "Barlow Condensed", sans-serif;
    font-weight: 700;
    font-size: 2.6vh;
    color: #FFE84D;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    line-height: 1.15;
  }

  /* odds/channel line */
  .gline {
    font-family: "Barlow Condensed", sans-serif;
    font-weight: 600;
    font-size: 2.3vh;
    color: #cfd3d8;
    text-transform: uppercase;
    text-align: center;
    letter-spacing: 0.02em;
    line-height: 1.1;
  }

  /* ===== TICKER category label ===== */
  /* Pinned to the top edge of the ticker zone, shifted up by its own height,
     so it always sits flush against the ticker's top edge regardless of zone layout. */
  #tk-label {
    position: fixed;
    top: var(--tk-t, 76vh);
    transform: translateY(-100%);
    left: var(--tk-l, 0);
    z-index: 2;
    background: #FFE84D;
    color: #111;
    font-family: "Oswald", sans-serif;
    font-weight: 700;
    font-size: 3.4vh;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 0.35vh 1.1vw 0.3vh;
    line-height: 1;
    pointer-events: none;
  }
  #tk-label:empty { display: none; }

  /* ===== TICKER band ===== */
  #zone-ticker { top: var(--tk-t,76vh); bottom: var(--tk-b,15vh); left: var(--tk-l,0); right: var(--tk-r,0); z-index: 1; display: flex; align-items: center; }
  #zone-ticker .track { display: inline-flex; align-items: center; white-space: nowrap;
    font-family: "Barlow Condensed", sans-serif; font-size: 4.6vh; font-weight: 700; will-change: transform; }

/* broadcast delay: render the snapshot from DELAY_SEC ago so the board matches a delayed TV/stream */
function promoteGames(force){
  if(!_snaps.length) return;
  const cutoff=Date.now()-(DELAY_SEC*1000);

function _nrm(s){ return (s||"").toLowerCase().replace(/&/g,"and").replace(/[^a-z0-9]/g,""); }

  const keys=[g.aAbbr,g.hAbbr,g.aLoc,g.hLoc].map(_nrm);

function fieldPos(g){

    ? (String(g.poss)===String(g.aId) ? "away" : String(g.poss)===String(g.hId) ? "home" : null)
    : null;

  const aLabel = T(g.aLogo, g.aAbbr) + (ps==="away" ? tkPoss() : "");
  const hLabel = T(g.hLogo, g.hAbbr) + (ps==="home" ? tkPoss() : "");

  const chan = g.channel ? ` <span class="sep">·</span> <span class="lbl">${g.channel}</span>` : "";
  const ln   = g.line    ? ` <span class="sep">·</span> ${g.line}` : "";

  if(g.state==="in"){
    const f = g.isUpset ? '<span class="upset">UPSET </span>' : (g.isClose ? '<span class="close">CLOSE </span>' : '');
    return `<span class="score">${aLabel} ${g.aS} – ${hLabel} ${g.hS}</span> <span class="sep">·</span> ${f}<span class="live">${g.detail}</span>${chan}${ln}`;
  }
  if(g.state==="pre"){
    return `<span class="pre">${aLabel} @ ${hLabel}</span> <span class="sep">·</span> ${g.start}${chan}${ln}`;
  }
  return `<span class="score">${aLabel} ${g.aS} – ${hLabel} ${g.hS}</span> <span class="sep">·</span> <span class="final">${g.detail}</span>`;
}

/* Full item HTML (outer wrapper + inner) — used when building the track from scratch */

/* _tkStructSig: tracks game ids+states only — used to decide when to full-rebuild the track.
   _tkContentSig: tracks scores+clocks — used to detect in-place update needs.
   _tkPool: the last pool of game objects, so we can patch in-place. */
let _tkStructSig = "", _tkContentSig = "";
let _tkPool = [];

function renderTicker(){
  const today=games.filter(g=>g.isToday);
  const mode=TICKER_MODE||"all";
  let pool=[];
  if(mode==="live") pool=today.filter(g=>g.state==="in").sort((a,b)=>b.watch-a.watch);
  else if(mode==="upcoming") pool=today.filter(g=>g.state==="pre").sort((a,b)=>a.date<b.date?-1:1);
  else if(mode==="top25") pool=today.filter(g=>g.ranked).sort((a,b)=>a.topRank-b.topRank);
  else {   /* all: FULL slate — live, then upcoming, then finals (ranked first) — not just ranked */
    pool=today.filter(g=>g.state==="in").sort((a,b)=>b.watch-a.watch)
      .concat(today.filter(g=>g.state==="pre").sort((a,b)=>a.date<b.date?-1:1).slice(0,14))
      .concat(today.filter(g=>g.state==="post").sort((a,b)=>a.topRank-b.topRank).slice(0,16));
  }
  if(!pool.length) pool=today.slice(0,16);

  /* structure sig: mode + game ids + states (drives full rebuild) */
  const structSig = mode + "|" + pool.map(g=>g.id+"|"+g.state).join(",");
  /* content sig: scores + detail/clock + possession (drives in-place patch) */
  const contentSig = pool.map(g=>g.aS+"|"+g.hS+"|"+g.detail+"|"+(g.poss||"")).join(",");

  setTickerLabel(mode);
  setTicker(pool, structSig, contentSig);
}

const TICKER_PXPS=90, TICKER_MAX=22; let _lastTicker="";   // continuous scroll

/* setTicker — called by renderTicker with pool (array of game objects), structSig, contentSig.
   Maintains two-copy seamless marquee. Full rebuild only when structure (game set/states) changes.
   In-place patch when only scores/clocks/possession change — scroll animation is NOT reset. */
function setTicker(poolOrArr, structSig, contentSig){
  const el = document.getElementById("t-ticker"); if(!el) return;

  /* TD-ticker writes plain HTML string arrays (legacy path); detect by element type */
  const isLegacy = poolOrArr.length > 0 && typeof poolOrArr[0] === "string";
  if(isLegacy){
    /* legacy call: poolOrArr is array of HTML strings, structSig is the combined key */
    const key = structSig || ("n"+poolOrArr.length);
    if(key === _lastTicker) return;
    _lastTicker = key; _tkStructSig = key; _tkContentSig = ""; _tkPool = [];
    const html = (poolOrArr.length ? poolOrArr.slice(0,TICKER_MAX) : ['<span class="item">No games today</span>']).join("");
    el.innerHTML = html + html; el.style.animation = "none";
    requestAnimationFrame(function(){ const w=el.scrollWidth/2; el.style.animation="scroll "+Math.max(12,Math.round(w/TICKER_PXPS))+"s linear infinite"; });
    return;
  }

  /* Normal path: poolOrArr is array of game objects */
  const pool = poolOrArr;
  const sSig = structSig || ("n"+pool.length);
  const cSig = contentSig || "";

  if(sSig !== _tkStructSig){
    /* Structure changed: rebuild content but PRESERVE the current scroll phase so the strip
       keeps flowing (items keep entering from the right) instead of snapping to the start. */
    const firstBuild = (_tkStructSig === "");
    _tkStructSig = sSig; _tkContentSig = cSig; _tkPool = pool; _lastTicker = sSig;
    let tx=0; const tform=getComputedStyle(el).transform;
    if(tform && tform.indexOf("matrix")===0){ const p=tform.slice(tform.indexOf("(")+1,tform.indexOf(")")).split(","); tx=parseFloat(p[4])||0; }
    const prevHalf = (el.scrollWidth/2) || 1;
    const phase = firstBuild ? 0 : ((((-tx % prevHalf) + prevHalf) % prevHalf) / prevHalf);   // 0..1 within one content width
    const items = pool.length ? pool.slice(0,TICKER_MAX).map(tickItem) : ['<span class="item">No games today</span>'];
    const html = items.join("");
    el.innerHTML = html + html;  /* duplicate for seamless loop */
    el.style.animation = "none";
    requestAnimationFrame(function(){
      const w=el.scrollWidth/2; const dur=Math.max(12,Math.round(w/TICKER_PXPS));
      el.style.animation="scroll "+dur+"s linear infinite";
      el.style.animationDelay = (-(phase*dur))+"s";   /* resume at the same phase — no snap */
    });
    return;
  }

  if(cSig !== _tkContentSig){
    /* Content-only change (scores/clock/possession): patch items in-place — scroll continues uninterrupted */
    _tkContentSig = cSig; _tkPool = pool;
    /* The track contains TWO copies of each item (for the seamless loop).
       Each item has data-gid matching g.id. Find all matching spans and patch innerHTML. */
    const lookup = {};
    pool.slice(0,TICKER_MAX).forEach(function(g){ lookup[g.id] = tickItemInner(g); });
    const items = el.querySelectorAll(".item[data-gid]");
    items.forEach(function(span){
      const gid = span.getAttribute("data-gid");
      if(lookup[gid] !== undefined && span.innerHTML !== lookup[gid]){
        span.innerHTML = lookup[gid];
      }
    });
  }
  /* else: nothing changed — no-op */
}
