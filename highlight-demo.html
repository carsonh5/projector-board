<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Highlight Demo — CU @ GT</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #08090b; color: #fff; font-family: "Segoe UI", system-ui, sans-serif;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 3vh 3vw; gap: 2vh; }
  h1 { font-family: "Oswald", sans-serif; font-size: 3vh; font-weight: 700; letter-spacing: 0.06em; }
  #status { font-size: 2vh; color: #9aa0a6; }
  #status.err { color: #FF2D95; max-width: 60ch; text-align: center; line-height: 1.5; }
  #stage { position: relative; width: min(88vw, 1100px); aspect-ratio: 16/9; background: #000;
    border: 1px solid #22262c; border-radius: 10px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  #cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 2vh 2vw;
    background: linear-gradient(transparent, #000000dd); font-family: "Oswald", sans-serif; font-size: 3vh; font-weight: 600; }
  #cap .k { color: #FFE84D; font-size: 1.8vh; letter-spacing: 0.1em; display: block; margin-bottom: 0.4vh; }
  #list { width: min(88vw, 1100px); display: flex; flex-direction: column; gap: 0.8vh; }
  .clip { display: flex; gap: 1vw; align-items: center; padding: 1vh 1.2vw; background: #101319; border-radius: 8px; cursor: pointer; }
  .clip:hover { background: #171b23; }
  .clip img { height: 7vh; border-radius: 5px; }
  .clip .h { font-size: 2vh; font-weight: 600; }
  .clip .d { font-size: 1.6vh; color: #9aa0a6; margin-left: auto; }
</style>
</head>
<body>
  <h1>HIGHLIGHT DEMO — CU @ Georgia Tech</h1>
  <div id="status">Loading highlights from ESPN in your browser&hellip;</div>
  <div id="stage"><video id="v" autoplay muted loop playsinline controls></video><div id="cap" style="display:none"></div></div>
  <div id="list"></div>

<script>
"use strict";
const EVENT = "401856776"; // CU @ GT, played today
const SUM = `https://site.api.espn.com/apis/site/v2/sports/football/college-football/summary?event=${EVENT}`;

function srcOf(v){
  const s = v.links?.source || {};
  return s.HD?.href || s.href || s.mezzanine || s.full?.href || v.links?.mobile?.source?.href || "";
}
function play(v){
  const src = srcOf(v);
  const vid = document.getElementById("v");
  const cap = document.getElementById("cap");
  vid.src = src; vid.play().catch(()=>{});
  cap.style.display = "block";
  cap.innerHTML = `<span class="k">HIGHLIGHT · ${v.duration||"?"}s</span>${v.headline||""}`;
}

(async () => {
  const st = document.getElementById("status");
  try{
    const r = await fetch(SUM);
    if(!r.ok) throw new Error("HTTP " + r.status + " (ESPN blocked this request)");
    const d = await r.json();
    const vids = (d.videos || []).filter(v => srcOf(v));
    if(!vids.length){ st.textContent = "Feed loaded, but this game has no highlight clips attached yet."; return; }
    st.textContent = `${vids.length} clips loaded — playing the first. Click any below to switch.`;
    play(vids[0]);
    const list = document.getElementById("list");
    list.innerHTML = vids.map((v,i)=>
      `<div class="clip" data-i="${i}">${v.thumbnail?`<img src="${v.thumbnail}">`:""}<span class="h">${v.headline||"Clip "+(i+1)}</span><span class="d">${v.duration||""}s</span></div>`
    ).join("");
    list.querySelectorAll(".clip").forEach(el => el.addEventListener("click", () => play(vids[+el.dataset.i])));
  }catch(e){
    st.className = "err";
    st.innerHTML = `Couldn't load highlights client-side: <b>${e.message}</b>.<br>`
      + `That's the expected case if ESPN blocks the browser request (CORS or bot filter). `
      + `The fix is the backend proxy — your buffs-dfw <b>espn.ts</b> pulls these exact clips server side, and the board reads playable URLs from it.`;
  }
})();
</script>
</body>
</html>
